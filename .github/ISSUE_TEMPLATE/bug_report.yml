name: Bug report
description: Report a reproducible problem in this Merhatta Softwares product.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping us improve the product. Do not include secrets or personal data.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Run…\n2. Provide…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include the product version, Python version, and operating system.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized output or a synthetic dataset if useful.
